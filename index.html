<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecciones pendientes por estudiante - Profe Judith</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #1f2937;
      --border: #cccccc;
      --header-bg: #111827;
      --header-text: #ffffff;
    }
    body.dark {
      --bg: #111827;
      --card-bg: #1f2937;
      --text: #f9fafb;
      --border: #374151;
      --header-bg: #000000;
      --header-text: #ffffff;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      font-size: 16px;
    }
    header {
      background-color: var(--header-bg);
      color: var(--header-text);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls {
      display: flex;
      gap: 8px;
    }
    button {
      background: #e5e7eb;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    body.dark button {
      background: #374151;
      color: #fff;
    }
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      text-align: center;
    }
    .drop-zone {
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      padding: 40px 20px;
      background-color: var(--card-bg);
      cursor: pointer;
      transition: background 0.3s;
    }
    .drop-zone h2 {
      margin: 0 0 10px 0;
      font-size: 1.2rem;
    }
    .drop-zone p {
      margin: 0;
      color: #6b7280;
      font-size: 0.95rem;
    }
    input[type="file"] {
      display: none;
    }
    footer {
      margin-top: 30px;
      color: #ef4444;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Lecciones pendientes por estudiante</h1>
    <div class="controls">
      <button onclick="changeFontSize(-1)">A-</button>
      <button onclick="changeFontSize(1)">A+</button>
      <button onclick="toggleDarkMode()">🌓 Claro / oscuro</button>
    </div>
  </header>

  <div class="container">
    <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
      <h2>Haga clic aquí para elegir el archivo CSV</h2>
      <p>o arrástrelo hasta este recuadro. Debe ser el reporte "Gradebook ... Points" de Lenguaje.</p>
      <input type="file" id="fileInput" accept=".csv">
    </div>

    <footer>
      @profejudith
    </footer>
  </div>

  <script>
    let currentFontSize = 16;
    function changeFontSize(delta) {
      currentFontSize += delta;
      document.body.style.fontSize = currentFontSize + 'px';
    }
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }
  </script>

</body>
</html>
